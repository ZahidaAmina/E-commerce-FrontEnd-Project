<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Product details — NEXAMART" />
  <title>Product — NEXAMART</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body id="product">
  <!-- Navbar & footer injected by js/app.js -->

  <section class="section product-section">
    <div class="wrapper">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
      <div id="productDetail"></div>
    </div>
  </section>

  <section class="section section-alt related-section">
    <div class="wrapper">
      <div class="section-head">
        <div>
          <span class="section-eyebrow">You might also like</span>
          <h2 class="section-title">Related Products</h2>
        </div>
      </div>
      <div class="product-grid" id="relatedProducts"></div>
    </div>
  </section>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
