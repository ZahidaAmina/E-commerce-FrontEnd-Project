<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse the full NEXAMART catalog — search, filter by category and sort to find exactly what you need." />
  <title>Shop — NEXAMART</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body id="shop">
  <!-- Navbar & footer injected by js/app.js -->

  <section class="shop-header">
    <div class="wrapper">
      <h1 class="shop-title">Shop</h1>
      <p class="shop-sub">Browse our full catalog. Search, filter and sort to find your next favorite.</p>
    </div>
  </section>

  <section class="section shop-section">
    <div class="wrapper">
      <div class="mb-5 flex items-center gap-4 max-md:flex-col max-md:items-stretch">
        <div class="relative max-w-[460px] flex-1 max-md:max-w-none">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-muted"></i>
          <input type="search" id="shopSearch" class="w-full rounded-sm border-[1.5px] border-border bg-surface py-3.5 pl-11 pr-4 outline-none transition-all focus:border-accent focus:ring-4 focus:ring-accent-soft" placeholder="Search products..." aria-label="Search products" />
        </div>
        <div class="ml-auto flex items-center gap-2.5 max-md:ml-0">
          <label for="shopSort" class="text-[0.88rem] font-medium text-secondary">Sort by</label>
          <select id="shopSort" class="cursor-pointer rounded-sm border-[1.5px] border-border bg-surface px-3.5 py-[11px] outline-none">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="rating">Top Rated</option>
            <option value="discount">Biggest Discount</option>
          </select>
        </div>
      </div>

      <div class="mb-5 flex flex-wrap gap-2.5" id="categoryFilters"></div>

      <div class="mb-5 flex flex-wrap items-center gap-4">
        <span id="resultCount" class="text-[0.95rem] font-semibold text-secondary"></span>
        <div id="activeFilters" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
